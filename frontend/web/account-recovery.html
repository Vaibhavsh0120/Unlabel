<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex">
  <title>Reset your password | Unlabel</title>
  <link rel="stylesheet" href="account-recovery.css">
  <script src="account-recovery.js" defer></script>
</head>
<body>
  <main>
    <a class="brand" href="/">unlabel</a>
    <h1>Choose a new password</h1>
    <p id="status" role="status" aria-live="polite">Checking your reset link…</p>
    <form id="recovery" hidden>
      <label for="password">New password</label>
      <input id="password" type="password" autocomplete="new-password" minlength="8" required>
      <p class="hint">Use at least 8 characters, including a letter and a number.</p>
      <label for="confirm">Confirm new password</label>
      <input id="confirm" type="password" autocomplete="new-password" minlength="8" required>
      <button id="submit" type="submit">Save new password</button>
    </form>
    <a class="return" href="/#/account-signin">Back to sign in</a>
  </main>
</body>
</html>

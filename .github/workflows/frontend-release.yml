name: Frontend APK and unsigned IPA release

on:
  push:
    branches: [main]
    paths: ['frontend/pubspec.yaml']
  workflow_dispatch:
    inputs:
      source_ref:
        description: Branch, tag, or commit to build (release tooling must match main)
        required: true
        default: main
        type: string
      backend_url:
        description: Public HTTPS backend origin used by the connected client
        required: true
        default: 'https://unlabel-api.vercel.app'
        type: string
      publish_release:
        description: Publish verified assets and update LiveContainer source (false keeps a draft)
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: frontend-mobile-release
  cancel-in-progress: false

env:
  SOURCE_REF: ${{ inputs.source_ref || github.sha }}
  BACKEND_BASE_URL: ${{ inputs.backend_url || 'https://unlabel-api.vercel.app' }}
  PUBLISH_RELEASE: ${{ github.event_name == 'push' && 'true' || format('{0}', inputs.publish_release) }}

defaults:
  run:
    shell: bash

jobs:
  version-gate:
    runs-on: ubuntu-24.04
    outputs:
      requested: ${{ steps.gate.outputs.requested }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_ref || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Detect a canonical frontend version increase
        id: gate
        run: python3 scripts/release/frontend_release_gate.py >> "$GITHUB_OUTPUT"

  checks:
    needs: version-gate
    if: needs.version-gate.outputs.requested == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      source_sha: ${{ steps.source.outputs.sha }}
      version: ${{ steps.metadata.outputs.version }}
      build_number: ${{ steps.metadata.outputs.build_number }}
      pubspec_version: ${{ steps.metadata.outputs.pubspec_version }}
      flutter_version: ${{ steps.metadata.outputs.flutter_version }}
    steps:
      - name: Validate source reference
        run: |
          python3 - <<'PY'
          import os, re
          ref = os.environ['SOURCE_REF']
          if not re.fullmatch(r'[A-Za-z0-9][A-Za-z0-9._/-]{0,199}', ref) or '..' in ref or '//' in ref or ref.endswith(('/', '.')):
              raise SystemExit('source_ref must be a plain branch, tag, or commit reference.')
          PY
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_ref || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Resolve canonical frontend and toolchain versions
        id: metadata
        run: python3 scripts/release/version_metadata.py --component frontend --format github >> "$GITHUB_OUTPUT"
      - name: Resolve one source commit and preserve workflow authorization
        id: source
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          SOURCE_SHA="$(git rev-parse HEAD)"
          git diff --quiet "origin/$DEFAULT_BRANCH" "$SOURCE_SHA" -- .github/workflows/ scripts/release/mobile_release.py scripts/release/package_ios.py scripts/release/prepare_android_ci.py scripts/release/version_metadata.py scripts/release/ios_source.py scripts/release/frontend_release_gate.py || {
            echo 'Source workflow and release helpers must match the default branch.'
            exit 1
          }
          printf 'sha=%s\n' "$SOURCE_SHA" >> "$GITHUB_OUTPUT"
      - name: Reject an existing release/tag before building
        env:
          GH_TOKEN: ${{ github.token }}
          GH_API_URL: ${{ github.api_url }}
          RELEASE_VERSION: ${{ steps.metadata.outputs.version }}
          BUILD_NUMBER: ${{ steps.metadata.outputs.build_number }}
        run: python3 scripts/release/mobile_release.py preflight
      - name: Verify authored platform icons and local OCR sources
        run: |
          python3 scripts/release/generate_app_icons.py --check
          python3 scripts/release/vendor_web_ocr.py --check
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ steps.metadata.outputs.flutter_version }}
          channel: stable
          cache: true
      - name: Check the connected Flutter client
        working-directory: frontend
        run: |
          flutter pub get --enforce-lockfile
          node --test test/*_web_test.cjs ../firebase/auth-bridge.test.cjs
          flutter analyze
          flutter test

  android:
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      RELEASE_VERSION: ${{ needs.checks.outputs.version }}
      BUILD_NUMBER: ${{ needs.checks.outputs.build_number }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.checks.outputs.source_sha }}
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ needs.checks.outputs.flutter_version }}
          channel: stable
          cache: true
      - name: Select JDK 17 and resolve pinned Android SDK requirements
        id: android-sdk
        run: |
          test -x "$JAVA_HOME_17_X64/bin/java"
          printf 'JAVA_HOME=%s\n' "$JAVA_HOME_17_X64" >> "$GITHUB_ENV"
          printf 'GRADLE_USER_HOME=%s/unlabel-gradle\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
          printf '%s/bin\n' "$JAVA_HOME_17_X64" >> "$GITHUB_PATH"
          python3 scripts/release/prepare_android_ci.py --versions-only >> "$GITHUB_OUTPUT"
      - name: Cache required NDK
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ steps.android-sdk.outputs.sdk_root }}/ndk/${{ steps.android-sdk.outputs.ndk_version }}
          key: ${{ runner.os }}-ndk-${{ steps.android-sdk.outputs.ndk_version }}
      - name: Cache Gradle dependencies and compiled tasks
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ${{ env.GRADLE_USER_HOME }}/caches
            ${{ env.GRADLE_USER_HOME }}/wrapper
          key: ${{ runner.os }}-gradle-${{ needs.checks.outputs.flutter_version }}-${{ hashFiles('frontend/pubspec.lock', 'frontend/android/**/*.gradle.kts', 'frontend/android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-gradle-${{ needs.checks.outputs.flutter_version }}-
      - name: Prepare Android SDK and bounded CI Gradle settings
        timeout-minutes: 20
        run: python3 scripts/release/prepare_android_ci.py
      - name: Restore registered stable demo signing certificate
        env:
          DEMO_KEYSTORE: ${{ secrets.UNLABEL_ANDROID_DEMO_KEYSTORE }}
        run: |
          test -n "$DEMO_KEYSTORE" || { echo 'Missing registered demo signing key.'; exit 1; }
          DEMO_KEY_PATH="$RUNNER_TEMP/unlabel-registered-demo.keystore"
          printf '%s' "$DEMO_KEYSTORE" | base64 --decode > "$DEMO_KEY_PATH"
          chmod 600 "$DEMO_KEY_PATH"
          keytool -list -v -keystore "$DEMO_KEY_PATH" -storepass android -alias androiddebugkey > "$RUNNER_TEMP/demo-certificate.txt"
          grep -qi '3E:7F:9E:3A:26:DC:4E:A8:0C:85:8A:48:12:BC:59:C7:2D:5F:D8:0A' "$RUNNER_TEMP/demo-certificate.txt" || { echo 'Restored demo key does not match the registered Google client.'; exit 1; }
          printf 'UNLABEL_DEMO_KEYSTORE=%s\n' "$DEMO_KEY_PATH" >> "$GITHUB_ENV"
      - name: Build and verify demo APK
        timeout-minutes: 35
        working-directory: frontend
        env:
          COMMIT_SHA: ${{ needs.checks.outputs.source_sha }}
        run: |
          flutter pub get --enforce-lockfile
          flutter build apk --release --no-pub --build-name "$RELEASE_VERSION" --build-number "$BUILD_NUMBER" --dart-define="BACKEND_BASE_URL=$BACKEND_BASE_URL" --dart-define="COMMIT_SHA=$COMMIT_SHA" 2>&1 | tee android-build.log
          APK_PATH='build/app/outputs/flutter-apk/app-release.apk'
          APKSIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          "$APKSIGNER" verify --print-certs "$APK_PATH" > apk-signing.txt
          grep -q 'CN=Android Debug' apk-signing.txt || { echo 'Expected demo debug signing; review production signing before changing this lane.'; exit 1; }
          grep -qi '3e7f9e3a26dc4ea80c858a4812bc59c72d5fd80a' apk-signing.txt || { echo 'APK signing certificate does not match the registered Google client.'; exit 1; }
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK_PATH" > apk-metadata.txt
          python3 - <<'PY'
          import os, pathlib, re
          metadata = pathlib.Path('apk-metadata.txt').read_text()
          for field, value in {'versionName': os.environ['RELEASE_VERSION'], 'versionCode': os.environ['BUILD_NUMBER']}.items():
              match = re.search(rf"{field}='([^']+)'", metadata)
              if not match or match[1] != value:
                  raise SystemExit(f'Android {field} does not match canonical metadata.')
          PY
          mkdir -p dist
          cp "$APK_PATH" "dist/unlabel-${RELEASE_VERSION}+${BUILD_NUMBER}-android-demo.apk"
          flutter --version --machine > dist/android-toolchain.json
      - name: Retain Android diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: android-build-diagnostics
          path: |
            frontend/android-build.log
            frontend/apk-metadata.txt
            frontend/apk-signing.txt
            ${{ env.GRADLE_USER_HOME }}/daemon/*/daemon-*.out.log
          if-no-files-found: warn
          retention-days: 3
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: android-release
          path: frontend/dist/*
          if-no-files-found: error
          retention-days: 3
          compression-level: 0

  ios:
    needs: checks
    runs-on: macos-15-intel
    timeout-minutes: 40
    env:
      RELEASE_VERSION: ${{ needs.checks.outputs.version }}
      BUILD_NUMBER: ${{ needs.checks.outputs.build_number }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.checks.outputs.source_sha }}
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ needs.checks.outputs.flutter_version }}
          channel: stable
          cache: true
      - name: Build device app and package unsigned IPA for LiveContainer
        working-directory: frontend
        env:
          COMMIT_SHA: ${{ needs.checks.outputs.source_sha }}
        run: |
          flutter pub get --enforce-lockfile
          flutter build ios --release --no-pub --no-codesign --build-name "$RELEASE_VERSION" --build-number "$BUILD_NUMBER" --dart-define="BACKEND_BASE_URL=$BACKEND_BASE_URL" --dart-define="COMMIT_SHA=$COMMIT_SHA"
          python3 ../scripts/release/package_ios.py --app build/ios/iphoneos/Runner.app --output "dist/unlabel-${RELEASE_VERSION}+${BUILD_NUMBER}-ios-unsigned.ipa" --version "$RELEASE_VERSION" --build-number "$BUILD_NUMBER"
          flutter --version --machine > dist/ios-toolchain.json
          python3 - <<'PY'
          import json, pathlib, subprocess
          path = pathlib.Path('dist/ios-toolchain.json')
          data = json.loads(path.read_text())
          data['xcode'] = subprocess.check_output(['xcodebuild', '-version'], text=True).strip()
          path.write_text(json.dumps(data, indent=2) + '\n')
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ios-release
          path: frontend/dist/*
          if-no-files-found: error
          retention-days: 3
          compression-level: 0

  release:
    needs: [checks, android, ios]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_API_URL: ${{ github.api_url }}
      RELEASE_VERSION: ${{ needs.checks.outputs.version }}
      BUILD_NUMBER: ${{ needs.checks.outputs.build_number }}
      SOURCE_SHA: ${{ needs.checks.outputs.source_sha }}
      PUBSPEC_VERSION: ${{ needs.checks.outputs.pubspec_version }}
      WORKFLOW_SHA: ${{ github.workflow_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.checks.outputs.source_sha }}
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: '*-release'
          path: dist
          merge-multiple: true
      - name: Verify and publish frontend assets, then refresh LiveContainer source
        run: python3 scripts/release/mobile_release.py publish --dist dist
      - name: Retain build verification reports in CI only
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: frontend-release-evidence
          path: |
            dist/build-manifest.json
            dist/SHA256SUMS.txt
            dist/*-toolchain.json
            dist/ios-package.json
          if-no-files-found: warn
          retention-days: 90

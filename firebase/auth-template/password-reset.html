<div style="margin:0;padding:24px 12px;background-color:#f1f8f4;color:#152a22;font-family:Arial,Helvetica,sans-serif;">
  <table role="presentation" style="width:100%;max-width:520px;margin:0 auto;border-collapse:separate;border-spacing:0;background-color:#ffffff;border:1px solid #dce9e1;border-radius:20px;">
    <tr>
      <td style="padding:32px 28px 8px;font-size:28px;font-weight:700;letter-spacing:-1px;">
        <span style="color:#23784f;">un</span><span style="color:#14251e;">label</span>
      </td>
    </tr>
    <tr>
      <td style="padding:16px 28px 0;">
        <h1 style="margin:0;font-size:28px;line-height:1.2;font-weight:700;letter-spacing:-0.6px;color:#14251e;">Reset your password</h1>
        <p style="margin:16px 0 0;font-size:16px;line-height:1.6;color:#50645a;">Choose a new password for your %APP_NAME% account.</p>
      </td>
    </tr>
    <tr>
      <td style="padding:28px;">
        <a href="%LINK%" style="display:inline-block;padding:15px 24px;border-radius:28px;background-color:#186b46;color:#ffffff;font-size:16px;line-height:1.3;font-weight:700;text-decoration:none;">Choose a new password</a>
        <p style="margin:24px 0 0;font-size:14px;line-height:1.6;color:#50645a;">Did not request this? Ignore this email. Your password stays the same.</p>
      </td>
    </tr>
    <tr>
      <td style="padding:20px 28px 28px;border-top:1px solid #e5eee8;">
        <p style="margin:0 0 8px;font-size:13px;line-height:1.6;color:#50645a;">Button not working? Copy this link into your browser:</p>
        <a href="%LINK%" style="font-size:12px;line-height:1.6;color:#186b46;overflow-wrap:break-word;word-break:break-word;">%LINK%</a>
      </td>
    </tr>
  </table>
</div>

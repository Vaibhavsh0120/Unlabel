[project]
name = "unlabel-backend"
version = "0.2.0"
requires-python = ">=3.12"
description = "Unlabel online product-data backend"
dependencies = [
  "fastapi==0.142.2", "httpx==0.28.1",
  "pydantic-settings==2.15.0", "uvicorn==0.54.0",
]

[tool.vercel]
entrypoint = "app.main:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]

[project]
name = "unlabel-backend"
version = "1.1.1"
requires-python = ">=3.12"
description = "Unlabel online product-data backend"
dependencies = [
  "fastapi==0.142.2", "httpx==0.28.1",
  "pydantic-settings==2.15.0", "uvicorn==0.54.0",
  "firebase-admin==7.7.0",
  "pywebpush==2.5.0",
]

[project.optional-dependencies]
selfhost = [
  "psycopg[binary]==3.3.9", "psycopg-pool==3.3.3",
  "pymongo==4.20.0", "redis==8.1.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]

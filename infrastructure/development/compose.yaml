# Next-major data-store development only. No production resources or API wiring.
name: unlabel-next-dev
services:
  postgres:
    image: postgres:18.7-bookworm@sha256:ece55f7868da684e400f82f1030a050718adbdd65c23aa500c486f6e2950dc0f
    environment:
      POSTGRES_USER: unlabel_bootstrap
      POSTGRES_DB: unlabel_app
      POSTGRES_PASSWORD_FILE: /run/secrets/pg_app
    secrets: [pg_app]
    volumes:
      - postgres:/var/lib/postgresql
    networks: [data]
    mem_limit: 1g
    cpus: 1
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U unlabel_bootstrap -d unlabel_app']
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped
  auth-postgres:
    image: postgres:18.7-bookworm@sha256:ece55f7868da684e400f82f1030a050718adbdd65c23aa500c486f6e2950dc0f
    environment:
      POSTGRES_USER: unlabel_auth_bootstrap
      POSTGRES_DB: unlabel_auth
      POSTGRES_PASSWORD_FILE: /run/secrets/pg_auth
    secrets: [pg_auth]
    volumes:
      - auth-postgres:/var/lib/postgresql
    networks: [data]
    mem_limit: 512m
    cpus: 0.5
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U unlabel_auth_bootstrap -d unlabel_auth']
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped
  mongo:
    image: mongo:8.0@sha256:d97fea17ccb8d004cd137be8dab54d70d0df11be69c9f422aefe4484c8414ab7
    environment:
      MONGO_INITDB_ROOT_USERNAME: unlabel_bootstrap
      MONGO_INITDB_ROOT_PASSWORD_FILE: /run/secrets/mongo_admin
    secrets: [mongo_admin]
    command: [mongod, --bind_ip_all, --wiredTigerCacheSizeGB, '0.25']
    volumes: [mongo:/data/db]
    networks: [data]
    mem_limit: 768m
    cpus: 1
    healthcheck:
      test: [CMD, mongosh, --quiet, --eval, 'quit(db.adminCommand({ping:1}).ok ? 0 : 1)']
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped
  cache:
    image: redis:8.8.4-alpine@sha256:1273af45b299d2b8b60d0e400d90aa6c2c5b1794f01d6a7ca60ff3ba6e65efb5
    command: [redis-server, --aclfile, /run/secrets/redis_acl, --maxmemory, 96mb, --maxmemory-policy, allkeys-lru, --save, '']
    secrets:
      - source: cache_acl
        target: redis_acl
      - source: cache_password
        target: redis_password
    networks: [data]
    mem_limit: 160m
    cpus: 0.25
    healthcheck:
      test: [CMD-SHELL, 'REDISCLI_AUTH=$$(cat /run/secrets/redis_password) redis-cli --user unlabel ping | grep -qx PONG']
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped
  jobs:
    image: redis:8.8.4-alpine@sha256:1273af45b299d2b8b60d0e400d90aa6c2c5b1794f01d6a7ca60ff3ba6e65efb5
    command: [redis-server, --aclfile, /run/secrets/redis_acl, --maxmemory, 96mb, --maxmemory-policy, noeviction, --appendonly, 'yes']
    secrets:
      - source: jobs_acl
        target: redis_acl
      - source: jobs_password
        target: redis_password
    volumes: [jobs:/data]
    networks: [data]
    mem_limit: 160m
    cpus: 0.25
    healthcheck:
      test: [CMD-SHELL, 'REDISCLI_AUTH=$$(cat /run/secrets/redis_password) redis-cli --user unlabel ping | grep -qx PONG']
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped
networks:
  data:
    internal: true
volumes:
  postgres:
  auth-postgres:
  mongo:
  jobs:
secrets:
  pg_app: {file: .secrets/pg-app}
  pg_auth: {file: .secrets/pg-auth}
  mongo_admin: {file: .secrets/mongo-admin}
  cache_password: {file: .secrets/cache-password}
  jobs_password: {file: .secrets/jobs-password}
  cache_acl: {file: .secrets/cache-acl}
  jobs_acl: {file: .secrets/jobs-acl}
